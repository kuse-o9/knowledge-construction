<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYLINE 会社別車両基地</title><style>
*{box-sizing:border-box}body{background:#edf3ef;color:#17342c;font:16px/1.65 system-ui,sans-serif;margin:0}main{max-width:1030px;margin:auto;padding:24px}h1{font-size:clamp(25px,5vw,40px)}a{color:#135e67}select{padding:11px;font:inherit;border:1px solid #9bb4a8;border-radius:10px;width:100%;background:white}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.floor{display:block;width:100%;padding:11px;text-align:left;background:#fff;border:1px solid #ceddd2;border-radius:8px;margin:4px 0;cursor:pointer}.floor[aria-current=true]{background:#bfe6d3;border-color:#479a77;font-weight:bold}.panel{padding:22px;border-radius:14px;background:white;min-height:320px}.train{display:block;background:#e9f6f0;padding:13px;border-radius:9px;margin:10px 0}.empty{color:#647770;background:#f3f5f2;padding:22px;border-radius:8px}small{color:#5f766a}@media(max-width:650px){.layout{grid-template-columns:1fr}.floors{max-height:200px;overflow:auto}}
</style><main><a href="../../index.html#game-room">← ゲームの部屋</a><h1>🚃 会社別・車両基地フロア案内</h1><p>鉄道会社ごとに専用フロア。好きなフロアを選び、完成済みの路線から運転ゲームを開始できます。これは新しい車両基地の入口の先行版で、3D車両基地そのものは今後拡張します。</p><label for="jump">フロアを選択</label><select id="jump"></select><div class="layout"><nav class="floors" id="floors" aria-label="会社別フロア一覧"></nav><section class="panel" id="detail" aria-live="polite"></section></div><p><small>未制作の車両は「準備中」と表示します。既存のゲームファイルは変更していません。</small></p></main>
<script>
const base='https://kuse-o9.github.io/knowledge-construction/';
fetch('./operator-floors.json').then(r=>{if(!r.ok)throw Error('フロア情報の取得に失敗');return r.json()}).then(data=>{
const floors=data.floors,select=document.getElementById('jump'),nav=document.getElementById('floors'),detail=document.getElementById('detail');function show(n){let f=floors.find(f=>f.floor===n);if(!f)return;select.value=String(n);nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.floor===n)));detail.replaceChildren();let h=document.createElement('h2');h.textContent=f.floor+'F '+f.operator;detail.append(h);if(f.sections){let sub=document.createElement('p');sub.textContent='路線別エリア：'+f.sections.join(' ／ ');detail.append(sub)}if(f.trains.length){for(const train of f.trains){let a=document.createElement('a');a.className='train';a.href=base+train.path;a.textContent='🚆 '+train.name+' — 運転する →';detail.append(a)}}else{let p=document.createElement('p');p.className='empty';p.textContent='この会社の運転ゲームは準備中。制作が完了するとここに追加されます。';detail.append(p)}}for(let f of floors){let o=document.createElement('option');o.value=f.floor;o.textContent=f.floor+'F '+f.operator;select.append(o);let b=document.createElement('button');b.type='button';b.className='floor';b.dataset.floor=f.floor;b.textContent=f.floor+'F　'+f.operator;b.onclick=()=>show(f.floor);nav.append(b)}select.onchange=()=>show(+select.value);show(18);
}).catch(e=>{document.getElementById('detail').textContent='読み込みエラー：'+e.message});
</script>
