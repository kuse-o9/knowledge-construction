<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知の作成・承認｜Study Note</title><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="study-tools.css?v=1"><link rel="stylesheet" href="study-access.css"><script src="study-access.js"></script><link rel="stylesheet" href="study-design.css?v=20261107c"><script defer src="study-navigation.js?v=20261107c"></script></head><body class="sn-app study-tool-page" data-notices="admin"><header><a class="brand" href="index.html">Study Note</a><nav><a href="admin.html">管理者ページ</a></nav></header><main><section class="hero"><div class="eyebrow">ADMIN NOTICES</div><h1>通知の作成・承認</h1><p>管理者向けはオーナーだけが掲載できます。利用者向けは管理者が作成し、オーナーの承認後に反映します。変更の承認待ちの間は、前の承認済み内容を表示し続けます。</p></section><p id="notice-status" role="status">本人確認を読み込んでいます…</p><section class="card"><h2>通知を書く</h2><form id="notice-form"><label>通知先<select id="notice-kind"><option value="customer">利用者向け（承認申請）</option><option value="admin" id="notice-admin-option" disabled>管理者向け（オーナー専用）</option></select></label><label>件名<input id="notice-title" maxlength="100" required></label><label>内容<textarea id="notice-body" maxlength="2000" rows="6" required></textarea></label><button id="notice-save">保存・申請する</button><button id="notice-new" type="button" class="secondary">新しい通知にする</button></form></section><section class="card"><h2>通知と承認待ち</h2><div class="feedback-controls"><button id="notice-refresh" class="secondary">更新</button><button id="notice-prev" class="secondary">前へ</button><span id="notice-page"></span><button id="notice-next" class="secondary">次へ</button></div><div id="notice-list"></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js?v=deadline1"></script><script src="notices.js?v=1"></script></body></html>
