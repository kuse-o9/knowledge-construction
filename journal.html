<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学習カレンダー｜Study Note</title><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="study-tools.css?v=1"><link rel="stylesheet" href="journal.css"><link rel="stylesheet" href="study-access.css"><script src="study-access.js"></script></head><body class="study-tool-page"><header><a href="index.html" class="brand">Study <span>Note</span></a><nav class="nav"><a href="decks.html">デッキ</a><a href="timer.html">タイマー</a><a href="account.html">アカウント</a></nav></header><main><section class="hero"><div class="eyebrow">SMALL STEPS, EVERY DAY</div><h1>学習カレンダー</h1><p>点数だけでなく、「何を試したか」を残そう。１問からでも、自分に合う勉強の型を作れます。</p></section><p id="journal-status" role="status">ログインを確認しています…</p><div id="journal-app" hidden><div class="journal-layout"><section class="card"><div class="journal-toolbar"><button id="month-prev" class="secondary" aria-label="前の月">←</button><h2 id="month-name"></h2><button id="month-next" class="secondary" aria-label="次の月">→</button></div><div class="calendar-week" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar" aria-label="学習した日を選ぶ"></div><p id="month-total" class="muted"></p></section><section class="card"><h2>その日の学習</h2><form id="journal-form"><label>日付<input id="journal-date" type="date" min="2020-01-01" required></label><div class="journal-time"><label>時間<input id="journal-hours" type="number" min="0" max="24" step="1" value="0" required></label><label>分<input id="journal-minutes" type="number" min="0" max="59" step="1" value="0" required></label></div><label>何をやった？ 次に変えたいことは？<textarea id="journal-body" rows="5" maxlength="1000" placeholder="例：方程式を３問。次は移項の符号を確認する。"></textarea></label><p class="muted">時間は自己申告です。AIへ送信・評価はしません。氏名・住所などは書かないでください。</p><button id="journal-save">この日の記録を保存</button><button id="journal-delete" type="button" class="secondary">この日の記録を削除</button></form></section></div><section class="card"><h2>最近７日間の積み重ね</h2><div id="journal-chart" class="journal-chart" aria-label="最近７日間の学習時間"></div><p id="journal-total" class="muted"></p></section><section class="card"><h2>記録の控え</h2><p>このブラウザー内でアカウント別に最大366日分・１MBまで保存します。端末間の同期はありません。共有パソコンには記録が残ります。個人の端末を使ってください。</p><button id="journal-export" class="secondary">学習記録をファイルに保存</button><label>控えを読み込む（選んだ日の記録を確認後に上書き）<input id="journal-import" type="file" accept=".json,application/json"></label></section></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js?v=deadline1"></script><script src="study-journal-store.js?v=1"></script><script src="journal.js?v=1"></script></body></html>
