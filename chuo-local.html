(async()=>{try{const parts=await Promise.all(["chuo-local-bundle-0.bin?v=a0ba2b38ebe3", "chuo-local-bundle-1.bin?v=a0ba2b38ebe3"].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error('data');return new Uint8Array(await r.arrayBuffer());})),bytes=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let at=0;for(const p of parts){bytes.set(p,at);at+=p.length;}const decoded=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),bundle=JSON.parse(decoded);if(bundle.html.includes('rail-journey')||bundle.html.includes('BAYLINE_JOURNEY')){const q=new URLSearchParams(location.search),plans={takao:['main'],otsuki:['main','west'],ome:['main','ome'],kawaguchiko:['main','west','fuji','lake'],okutama:['main','ome','okutama']},id=Object.hasOwn(plans,q.get('journey'))?q.get('journey'):'takao',legs=q.get('travel')==='in'?plans[id].slice().reverse():plans[id],leg=Math.min(legs.length-1,Math.max(0,Number(q.get('leg'))||0)),segment=legs[leg];if(segment!=='main'){document.getElementById('loading').textContent='直通区間の模型を読み込んでいます…';const response=await fetch('chuo-'+segment+'.bin');if(!response.ok)throw Error('extension');const data=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).json();if(data.segment!==segment)throw Error('segment');window.__BAYLINE_EXTENSION=data;}}window.__keihinModelFiles=bundle.models;const originalFetch=window.fetch.bind(window);window.fetch=async(input,options)=>{const value=typeof input==='string'?input:input.url,key=value.split('?')[0].replace(/^\.\//,'');if(Object.hasOwn(window.__keihinModelFiles,key))return new Response(window.__keihinModelFiles[key],{headers:{'Content-Type':'application/json'}});return originalFetch(input,options);};document.open();document.write(bundle.html);document.close();}catch(e){document.getElementById('loading').textContent=e.message==='extension'?'直通区間のデータを読み込めません。必要な区間ファイルの追加を確認してください。':'準備に失敗しました。新しいChromeまたはEdgeで開き直してください。';}})();
</script></body></html>
