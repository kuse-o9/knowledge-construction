<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYLINE｜3D会社別車両基地</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b202b;color:#e8f6f7;font:16px/1.5 system-ui,"Yu Gothic",sans-serif}main{max-width:1100px;padding:24px;margin:auto}a{color:#a2e2ff}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px}.scene{height:520px;perspective:950px;overflow:hidden;border-radius:16px;background:radial-gradient(circle at 40% 40%,#356779,#102836 70%);display:grid;place-items:center}.tower{height:400px;width:210px;position:relative;transform-style:preserve-3d;transform:rotateX(-10deg) rotateY(-28deg)}.face{position:absolute;inset:0;background:repeating-linear-gradient(to top,#315b69 0 13px,#81aab5 13px 15px,#183642 15px 17.3px);border:2px solid #abcbd4;box-shadow:inset 0 0 25px #041821}.front{transform:translateZ(70px)}.back{transform:rotateY(180deg) translateZ(70px)}.left{width:140px;left:35px;transform:rotateY(-90deg) translateZ(105px)}.right{width:140px;left:35px;transform:rotateY(90deg) translateZ(105px)}.top{height:140px;top:130px;transform:rotateX(90deg) translateZ(200px);background:#6d9baa}.beam{position:absolute;left:-15px;width:240px;height:13px;background:#ffe9a2;box-shadow:0 0 30px #f3bc45;transform:translateZ(74px);transition:bottom .45s ease}.panel{background:#173540;border:1px solid #365e69;border-radius:16px;padding:20px}.status{color:#c4e0e2}label{display:block;margin:14px 0 5px}select,button{font:inherit;border-radius:8px;padding:10px 12px}select{width:100%;background:#f6faf9;color:#142d34}button{background:#b9f2d1;border:0;color:#103b30;cursor:pointer}.train{display:block;border:1px solid #66858b;padding:12px;margin:10px 0;border-radius:9px;background:#214b55;text-decoration:none}.train:hover{background:#326877}.small{font-size:13px;color:#bdd4d5}.rail{height:70px;position:relative;margin:16px 0;background:repeating-linear-gradient(90deg,#566f75 0 5px,transparent 5px 26px),linear-gradient(transparent 32px,#cbd7d9 32px 36px,transparent 36px 53px,#cbd7d9 53px 57px,transparent 57px);border-radius:8px}.car{position:absolute;top:10px;left:8%;width:76%;height:44px;background:#cfdfe0;border-bottom:8px solid #488ec3;border-radius:10px}.car:after{content:"";position:absolute;inset:9px 12px 13px;background:repeating-linear-gradient(90deg,#40728a 0 23px,#d6e8ef 23px 31px)}@media(max-width:760px){.grid{grid-template-columns:1fr}.scene{height:400px}.tower{transform:rotateX(-10deg) rotateY(-28deg) scale(.75)}}@media(prefers-reduced-motion:reduce){.beam{transition:none}}</style>
<main><p><a href="index.html#game-room">← ゲームの部屋へ戻る</a></p><h1>🚆 鉄道会社別・立体車両基地</h1><p>各鉄道会社を1フロアに配置。エレベーターで選んだ階へ移動し、準備済みの運転ゲームに出発できるよ。</p>
<div class="grid"><div class="scene" role="img" aria-label="23フロアの立体車両基地と選択階を示す光る表示"><div class="tower"><div class="face front"></div><div class="face back"></div><div class="face left"></div><div class="face right"></div><div class="face top"></div><div class="beam" id="indicator" style="bottom:0"></div></div></div>
<section class="panel"><h2>エレベーター <span id="floor-num">18F</span></h2><label for="floors">鉄道会社・フロア</label><select id="floors"></select><p id="company" class="status" aria-live="polite"></p><div class="rail"><div class="car" aria-hidden="true"></div></div><div id="routes"></div><p class="small">建物はゲーム向けの簡易立体表示。車両基地内を歩く・車両を3Dで個別鑑賞する機能は今後の実装対象です。実在の車両基地の構造ではありません。</p></section></div></main>
<script>'use strict';const floors=[{"floor":1,"operator":"東武鉄道","trains":[]},{"floor":2,"operator":"西武鉄道","trains":[]},{"floor":3,"operator":"京成電鉄","trains":[]},{"floor":4,"operator":"京王電鉄","trains":[]},{"floor":5,"operator":"小田急電鉄","trains":[]},{"floor":6,"operator":"東急電鉄","trains":[]},{"floor":7,"operator":"京浜急行電鉄（京急）","trains":[]},{"floor":8,"operator":"相模鉄道（相鉄）","trains":[]},{"floor":9,"operator":"東京メトロ","trains":[]},{"floor":10,"operator":"東京都交通局","trains":[],"sections":["都営浅草線","都営三田線","都営新宿線","都営大江戸線","都電荒川線（東京さくらトラム）","日暮里・舎人ライナー"]},{"floor":11,"operator":"横浜市交通局","trains":[]},{"floor":12,"operator":"首都圏新都市鉄道（つくばエクスプレス）","trains":[]},{"floor":13,"operator":"東京モノレール","trains":[]},{"floor":14,"operator":"秩父鉄道","trains":[]},{"floor":15,"operator":"関東鉄道","trains":[]},{"floor":16,"operator":"宇都宮ライトレール","trains":[]},{"floor":17,"operator":"JR北海道","trains":[]},{"floor":18,"operator":"JR東日本","trains":[{"name":"山手線","path":"yamanote/index.html"},{"name":"京浜東北・根岸線","path":"keihin.html"},{"name":"中央線快速","path":"chuo.html"},{"name":"中央・総武線各駅停車","path":"chuo-local.html"},{"name":"総武線快速（検証版）","path":"sobu.html"}]},{"floor":19,"operator":"JR東海","trains":[]},{"floor":20,"operator":"JR西日本","trains":[]},{"floor":21,"operator":"JR四国","trains":[]},{"floor":22,"operator":"JR九州","trains":[]},{"floor":23,"operator":"ゆりかもめ株式会社","trains":[{"name":"ゆりかもめ","path":"railway/index.html"}],"note":"追加の専用フロア。既存ゲームとの接続を維持"}],select=document.getElementById('floors'),routes=document.getElementById('routes'),indicator=document.getElementById('indicator'),base='https://kuse-o9.github.io/knowledge-construction/';for(const f of floors){const o=document.createElement('option');o.value=f.floor;o.textContent=f.floor+'F｜'+f.operator;select.append(o)}function show(){const f=floors.find(x=>x.floor===Number(select.value));if(!f)return;document.getElementById('floor-num').textContent=f.floor+'F';document.getElementById('company').textContent=f.operator+(f.sections?' — '+f.sections.join('・'):'');indicator.style.bottom=((f.floor-1)/(floors.length-1)*388)+'px';routes.replaceChildren();if(!f.trains.length){let p=document.createElement('p');p.textContent='この会社の運転ゲームは準備中です。';routes.append(p)}else for(const t of f.trains){let a=document.createElement('a');a.className='train';a.href=base+t.path;a.textContent='🚃 '+t.name+'　運転する →';routes.append(a)}}select.addEventListener('change',show);select.value=18;show();</script>
