<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0; style-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'"><title>管理者のつぶやきを投稿｜Study Note</title><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="study-access.css"><link rel="stylesheet" href="staff-updates.css?v=2"><script src="study-access.js"></script></head><body data-staff-admin="true"><header><div class="site-nav"><a class="brand" href="index.html">Study Note</a><nav><a href="index.html">ホーム</a><a href="staff-updates.html">管理者のつぶやき</a><a href="admin.html">管理者ページ</a><a href="account.html">アカウント</a></nav></div></header><main class="staff-layout"><div class="eyebrow">STAFF NOTES</div><h1>管理者のつぶやきを投稿</h1><p class="staff-intro">管理者・オーナーのひとことを届ける専用スペースです。利用者の掲示板とは別枠です。</p><p id="updates-message" class="message-box" role="status" aria-live="polite">利用権限を確認しています…</p><section id="updates-compose" class="card" hidden><h2>つぶやきを書く</h2><p>投稿するとすぐ公開されます。個人情報や秘密の情報は書かないでください。</p><p id="updates-author"></p><form id="updates-form"><label for="updates-body">本文</label><textarea id="updates-body" maxlength="1000" required placeholder="今日のお知らせや、ちょっとしたひとこと…"></textarea><label for="updates-photos">写真を追加（３枚まで）</label><input id="updates-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p id="updates-photo-note" role="status"></p><p>写真は１枚10MBまで。保存時は最大1600px・256KB以内に変換し、位置情報などの付加情報を取り除きます。</p><p id="updates-count">0 / 1000文字</p><button id="updates-submit" type="submit">つぶやきを公開</button></form><p>自分の投稿は削除できます。オーナーはすべての投稿を削除できます。</p></section><section aria-label="つぶやき一覧"><div class="form-actions"><button id="updates-refresh" type="button" class="secondary">最新に更新</button><a href="staff-updates.html">利用者向けの表示を見る →</a></div><div id="updates-list"></div><nav class="staff-pages" aria-label="つぶやきのページ"><button id="updates-prev" type="button" class="secondary">前のページ</button><span id="updates-page">1ページ</span><button id="updates-next" type="button" class="secondary">次のページ</button></nav></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script><script src="staff-photos.js?v=1"></script><script src="staff-updates.js?v=2"></script></body></html>
