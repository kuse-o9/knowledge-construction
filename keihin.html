<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYLINE 京浜東北線</title><style>body{background:#12232c;color:#ebf2f4;font:16px/1.8 system-ui;padding:30px}a{color:#98d5ec}</style></head><body><h1>京浜東北線</h1><p id="loading">車両・ホーム・街のモデルを準備しています…</p><a href="https://kuse-o9.github.io/knowledge-construction/index.html#game-room">ゲームの部屋に戻る</a><script>
(async()=>{try{const parts=await Promise.all(['keihin-bundle-0.bin?v=d6b815a23334','keihin-bundle-1.bin?v=d6b815a23334'].map(async path=>{const r=await fetch(path);if(!r.ok)throw Error('game data '+r.status);return new Uint8Array(await r.arrayBuffer());})),bytes=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let offset=0;for(const part of parts){bytes.set(part,offset);offset+=part.length;}const decoded=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),bundle=JSON.parse(decoded);window.__keihinModelFiles=bundle.models;const originalFetch=window.fetch.bind(window);window.fetch=async(input,options)=>{const value=typeof input==='string'?input:input.url,key=value.split('?')[0].replace(/^\.\//,'');if(Object.hasOwn(window.__keihinModelFiles,key))return new Response(window.__keihinModelFiles[key],{headers:{'Content-Type':'application/json'}});return originalFetch(input,options);};document.open();document.write(bundle.html);document.close();}catch(e){document.getElementById('loading').textContent='準備に失敗しました。新しいChromeまたはEdgeで開き直してください。';}})();
</script></body></html>
