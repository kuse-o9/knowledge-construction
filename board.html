<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0; style-src 'self'; img-src 'self' data:; connect-src https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'"><title>勉強の掲示板｜Study Note</title><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="study-access.css"><link rel="stylesheet" href="board.css?v=1"><script src="study-access.js"></script></head><body><header><div class="site-nav"><a class="brand" href="index.html">Study Note</a><nav><a href="index.html">ホーム</a><a href="staff-updates.html">管理者のつぶやき</a><a href="account.html">アカウント</a></nav></div></header><main class="board-layout"><div class="eyebrow">LEARN TOGETHER</div><h1>勉強の掲示板</h1><p>分からないところも、うまくいった勉強法も。みんなで一つずつ。</p><p class="board-guide">ログインした利用者に投稿が公開されます。名前・学校・連絡先・パスワードは書かないでください。教科書の丸写しや悪口も控えましょう。管理者のつぶやきとは別の掲示板です。</p><p id="board-status" role="status" aria-live="polite">ログインを確認しています…</p><a id="board-login" href="account.html" hidden>ログインする →</a><section id="board-area" hidden><section id="board-browse"><div class="card"><form id="board-search-form"><label for="board-search">題名・本文を検索</label><div class="board-actions"><input id="board-search" maxlength="60" type="search" placeholder="例：方程式、英単語"><button type="submit">検索</button><button id="board-refresh" type="button">更新</button></div></form><label id="board-moderation-label" hidden><input id="board-moderation" type="checkbox">管理者：非表示の投稿も確認する</label></div><div id="board-list" class="board-list"></div><nav class="board-actions" aria-label="掲示板のページ"><button id="board-prev" type="button">前へ</button><span id="board-page">1ページ</span><button id="board-next" type="button">次へ</button></nav><section class="card"><h2>質問・勉強の話を投稿する</h2><form id="board-post"><label for="board-category">教科・テーマ</label><select id="board-category"><option>数学</option><option>英語</option><option>理科</option><option>社会</option><option>国語</option><option>勉強法</option><option>その他</option></select><label for="board-title">題名（100文字まで）</label><input id="board-title" required maxlength="100" autocomplete="off"><label for="board-body">内容（3000文字まで）</label><textarea id="board-body" required maxlength="3000" rows="5" placeholder="どこまで考えたか、何が分からないかも書くと答えやすくなります。"></textarea><button type="submit">投稿する</button></form><p class="muted">連続投稿は10秒間隔・1日50件まで。投稿後も、本人が本文を削除できます。</p></section></section><section id="board-thread" hidden><button id="board-back" type="button">← 一覧へ戻る</button><div id="board-messages" class="board-list"></div><form id="board-reply" class="card"><h2>返信する</h2><label for="board-reply-body">返信（3000文字まで）</label><textarea id="board-reply-body" required maxlength="3000" rows="4"></textarea><button type="submit">返信を投稿</button></form></section></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script><script src="board.js?v=1"></script></body></html>
