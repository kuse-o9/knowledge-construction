<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>管理者ページ｜Study Note</title><link rel="stylesheet" href="study.css"></head>
<body><header><div class="site-nav"><a class="brand" href="index.html"><span>Study</span> Note</a><nav aria-label="メインメニュー"><a href="index.html">ホーム</a><a href="decks.html">デッキ</a><a href="memory.html">暗記ノート</a><a href="account.html">アカウント</a></nav></div></header>
<main><div class="admin-title"><div><div class="eyebrow">Study Note 管理</div><h1>管理者ページ</h1></div><a class="button secondary" href="decks.html">デッキを確認 →</a></div><p id="message" role="status" aria-live="polite">利用権限を確認しています…</p><div id="root"></div><p><a href="account.html">ログイン・アカウント設定</a></p></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script>
<script type="module">
const root=document.getElementById('root'),message=document.getElementById('message');let generation=0;
function clear(){generation++;root.replaceChildren();message.textContent='ログイン・利用権限を確認してください。';}
if(!window.Study || Study.setupError){message.textContent=Study?.setupError || '通信を確認してください。';}
else {
 Study.client.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT') clear();});
 const ticket=++generation;
 try {
  const data=await Study.api('admin_bootstrap');
  if(ticket===generation){
   // Both markup and module come only from the authorized server response.
   root.innerHTML=data.html;
   const url=URL.createObjectURL(new Blob([data.script],{type:'text/javascript'}));
   try {const module=await import(url);if(ticket===generation) await module.default(root,data,message);} finally {URL.revokeObjectURL(url);}
  }
 } catch(e){root.replaceChildren();message.textContent=e.message;message.classList.add('error');}
}
</script></body></html>
