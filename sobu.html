<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYLINE 総武線快速</title><style>body{background:#12232c;color:#edf4f5;font:16px/1.8 system-ui;padding:30px}a{color:#a0c9ed}</style></head><body><h1>総武線快速</h1><p id="loading">車両・ホーム・街のモデルを準備しています…</p><a href="index.html#game-room">ゲームの部屋に戻る</a><script>
(async()=>{try{const parts=await Promise.all(["sobu-data-0.bin?v=0e0f40c9a30c", "sobu-data-1.bin?v=0e0f40c9a30c"].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error('data');return new Uint8Array(await r.arrayBuffer());})),bytes=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let at=0;for(const p of parts){bytes.set(p,at);at+=p.length;}const bundle=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());document.open();document.write(bundle.html);document.close();}catch(e){document.getElementById('loading').textContent='ゲームのデータを読み込めませんでした。Ctrl＋F5で再読み込みしてください。';}})();
</script></body></html>
