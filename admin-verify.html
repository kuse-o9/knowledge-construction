<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>管理者の本人確認｜Study Note</title><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="study-access.css"><script src="study-access.js"></script></head><body><header><div class="site-nav"><a class="brand" href="index.html">Study Note</a><a href="account.html">アカウント</a></div></header><main><section class="card"><div class="eyebrow">Study Note 管理</div><h1>管理者の本人確認</h1><p>ログイン中のメールアドレスと登録済みの管理者権限を確認し、パスワードをもう一度照合します。</p><p id="verify-message" role="status" aria-live="polite">ログイン状態を確認しています…</p><form id="admin-verify" hidden><label for="verify-email">管理者のメールアドレス</label><input id="verify-email" type="email" autocomplete="username" required maxlength="254"><label for="verify-password">パスワード</label><input id="verify-password" type="password" autocomplete="current-password" required maxlength="128"><button class="button" type="submit">確認して管理者ページへ</button></form><p>確認の有効時間は20分です。権限を外された場合は、その時点で利用できなくなります。</p><a href="account.html">ログイン・アカウント設定へ</a></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script><script src="admin-verify.js"></script></body></html>
