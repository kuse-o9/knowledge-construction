<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>管理者の本人確認｜Study Note</title><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="study-access.css"><script src="study-access.js"></script></head><body><header><div class="site-nav"><a class="brand" href="index.html">Study Note</a><a href="account.html">アカウント</a></div></header><main><section class="card"><div class="eyebrow">Study Note 管理</div><h1>管理者の本人確認</h1><p>管理者アカウントの確認に加え、ログイン用とは別の「管理者専用パスワード」が必要です。</p><p id="verify-message" role="status" aria-live="polite">ログイン状態を確認しています…</p><form id="admin-verify" hidden><label for="verify-email">管理者のメールアドレス</label><input id="verify-email" type="email" autocomplete="username" required maxlength="254"><label for="verify-password">アカウントのパスワード</label><input id="verify-password" type="password" autocomplete="current-password" required maxlength="128"><label for="admin-password">管理者専用パスワード</label><input id="admin-password" type="password" autocomplete="off" required minlength="16" maxlength="64"><button class="button" type="submit">確認して管理者ページへ</button></form><p>確認の有効時間は20分です。権限の解除・専用パスワードの変更後は、再確認が必要になります。</p><a href="account.html">ログイン・アカウント設定へ</a></section><section id="password-owner" class="card" hidden><h2 id="password-owner-title">管理者専用パスワードの設定</h2><p>この設定はオーナー限定です。管理者全員が使う追加のパスワードです。変更すると、他の管理者は再確認が必要になります。忘れた場合も、ここから再設定できます。</p><form id="admin-password-set"><label for="owner-password">オーナーアカウントのパスワード</label><input id="owner-password" type="password" autocomplete="current-password" required maxlength="128"><label for="new-admin-password">新しい管理者専用パスワード（半角16〜64文字）</label><input id="new-admin-password" type="password" autocomplete="new-password" required minlength="16" maxlength="64" pattern="[!-~]{16,64}"><button id="generate-admin-password" type="button">安全なパスワードを自動生成</button><label><input id="show-admin-password" type="checkbox">新しい専用パスワードを表示</label><label for="new-admin-again">新しい専用パスワードをもう一度</label><input id="new-admin-again" type="password" autocomplete="new-password" required minlength="16" maxlength="64"><label><input id="saved-admin-password" type="checkbox" required>新しい専用パスワードを安全な場所に控えました</label><p>自動生成した値は、この画面を離れると消えます。登録前に必ず控えてください。</p><button type="submit">専用パスワードを設定して管理者ページへ</button></form></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script><script src="admin-verify.js"></script></body></html>
