<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Study Noteの公式デッキ。ジャンル・教科・学年から問題を探して学習できます。"><title>公式デッキ｜Study Note</title><link rel="stylesheet" href="study.css"></head>
<body><header><nav aria-label="メインメニュー"><a href="index.html">ホーム</a><a href="decks.html">公式デッキ</a><a href="memory.html">自分の暗記ノート</a><a href="account.html">アカウント</a><a href="admin.html">管理者ページ</a></nav></header>
<main><h1>公式デッキ</h1><p id="message" role="status" aria-live="polite">公開中のデッキを読み込んでいます…</p>
<section id="catalog"><div class="card"><label>検索<input id="search" type="search" placeholder="デッキ名・説明・ジャンル・教科・学年"></label><div class="filters"><button id="refresh">一覧を更新</button><label>ジャンル<select id="genre"><option value="">すべて</option></select></label><label>教科<select id="subject"><option value="">すべて</option></select></label><label>学年<select id="grade"><option value="">すべて</option></select></label></div><p id="result-count"></p></div><div id="deck-list" class="deck-grid"></div></section>
<section id="practice" hidden><button id="back" class="secondary">デッキ一覧に戻る</button><div class="card"><h2 id="deck-title"></h2><p id="progress" class="progress"></p><p id="prompt" style="white-space:pre-wrap"></p><img id="image" class="question-image" alt="問題の画像" hidden><button id="hint-button" class="secondary">ヒントを見る</button><p id="hint" class="answer" hidden></p>
<label>自分の回答・メモ<textarea id="response" maxlength="10000" placeholder="ここに自分で答えを書けます"></textarea></label><p class="muted">回答・手書きメモは、このブラウザーだけに保存します。AI採点は次の段階で追加します。</p>
<canvas id="note" class="note" width="1200" height="480" aria-label="手書きメモ用のキャンバス"></canvas><button id="clear-note" class="secondary">手書きメモを消す</button><button id="answer-button">答え・解説を見る</button><div id="answer" class="answer" hidden><strong>答え</strong><p id="answer-text" style="white-space:pre-wrap"></p><strong>解説</strong><p id="explanation" style="white-space:pre-wrap"></p></div>
<div><button id="prev" class="secondary">前の問題</button><button id="next">次の問題</button></div></div></section>
</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script><script src="decks.js"></script></body></html>
