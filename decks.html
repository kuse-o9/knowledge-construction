<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Study Noteのデッキ。教科・学年から問題を探して、書いて学習しよう。"><title>デッキ｜Study Note</title><link rel="stylesheet" href="study.css"></head>
<body><header><div class="site-nav"><a class="brand" href="index.html"><span>Study</span> Note</a><nav aria-label="メインメニュー"><a href="index.html">ホーム</a><a href="decks.html" aria-current="page">デッキ</a><a href="memory.html">暗記ノート</a><a href="account.html">アカウント</a><a href="admin.html">管理者ページ</a><a href="feedback.html">フィードバック</a></nav></div></header>
<main><div class="hero"><div><div class="eyebrow">問題を探して、書いて覚える</div><h1>今日は、どのデッキをやる？</h1><p>教科や学年から選んで、自分のペースで１問ずつ。<br>考えて、書いて、答えを確かめよう。</p></div><svg class="hero-icon" viewBox="0 0 140 140" fill="none" aria-hidden="true"><rect x="38" y="18" width="76" height="99" rx="11" transform="rotate(12 38 18)" fill="#49858B"/><rect x="20" y="23" width="76" height="99" rx="11" transform="rotate(-8 20 23)" fill="#A9DED0"/><path d="M43 53L78 48M46 68L81 63M49 84L70 81" stroke="#285A60" stroke-width="5" stroke-linecap="round"/></svg></div>
<p id="message" class="message-box" role="status" aria-live="polite">公開中のデッキを読み込んでいます…</p>
<section id="catalog"><div class="card filter-card"><div class="search-row"><label>キーワードで探す<input id="search" type="search" placeholder="デッキ名、単元、教科など"></label><button id="refresh" class="secondary">一覧を更新</button></div><div class="filters"><label>ジャンル<select id="genre"><option value="">すべてのジャンル</option></select></label><label>教科<select id="subject"><option value="">すべての教科</option></select></label><label>学年<select id="grade"><option value="">すべての学年</option></select></label></div></div><div class="section-heading"><h2>デッキ一覧</h2><span id="result-count" class="muted"></span></div><div id="deck-list" class="deck-grid"></div></section>
<section id="practice" hidden><div class="section-heading"><button id="back" class="secondary">← デッキ一覧</button><span id="progress" class="progress"></span></div><div class="practice-grid"><article class="card"><div class="eyebrow">問題</div><h2 id="deck-title"></h2><p id="prompt" style="white-space:pre-wrap"></p><img id="image" class="question-image" alt="問題の画像" hidden><button id="hint-button" class="secondary">ヒントを見る</button><p id="hint" class="answer" hidden></p><button id="answer-button">答え・解説を見る</button><div id="answer" class="answer" hidden><strong>答え</strong><p id="answer-text" style="white-space:pre-wrap"></p><strong>解説</strong><p id="explanation" style="white-space:pre-wrap"></p></div></article>
<div class="card"><div class="eyebrow">自分のノート</div><h2>考えたことを書こう</h2><label>自分の回答・メモ<textarea id="response" maxlength="10000" placeholder="答えや途中の考え方を、ここに"></textarea></label><label>手書きメモ</label><canvas id="note" class="note" width="1200" height="480" aria-label="手書きメモ用のキャンバス"></canvas><button id="clear-note" class="secondary">手書きメモを消す</button><p class="muted">このブラウザーに自動保存します。AI採点はまだ入っていません。</p><div class="form-actions"><button id="prev" class="secondary">← 前の問題</button><button id="next">次の問題 →</button></div></div></div></section>
</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0"></script><script src="study-client.js"></script><script src="decks.js"></script></body></html>
